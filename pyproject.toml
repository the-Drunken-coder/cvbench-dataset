[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cvbench-dataset"
version = "0.1.0"
description = "Canonical, review-bound dataset packaging for CVBench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "CVBench contributors"}]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]
annotation = [
  "lap==0.5.12",
  "pycocotools==2.0.11",
  "ultralytics==8.4.120",
]

[project.scripts]
cvbench-dataset = "cvbench_dataset.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cvbench_dataset = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
